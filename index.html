<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenqi</title>
    <link rel="stylesheet" href="./weatherapp.css">
    <script src="./config.js"></script>
    <script src="./weatherapp.js"></script>
</head>
<body>
    <div id="background-layer"></div>
    <div class="container">
        <h1>Tenqi</h1>
        <input type="text" id="inputLocation" placeholder="Enter location name">
        <button id="buttonSearch">Search</button>
        <div class="info">
            <div class="location">
                <h2 id="city"></h2>
                <h2 id="country"></h2>
            </div>
            <div class="temperature">
                <h2 id="weather"></h2>
                <h2 id="temperature"></h2>
            </div>

            <img id="icon" src="./pictures/weather/blank.png" alt="empty icon">
        </div>
        <div id="fiveDayForecast"></div>
</body>
</html>
